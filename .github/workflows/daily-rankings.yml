name: Daily K-matchup rankings

on:
  schedule:
    # Morning slate (~7:00 AM America/New_York)
    - cron: "0 11 * * *"
    # Afternoon refresh after lineups (~4:00 PM America/New_York)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Score date YYYY-MM-DD (default: today UTC)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-k-matchup-rankings
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mlb-k-matchups/requirements.txt

      - name: Install dependencies
        run: pip install -r mlb-k-matchups/requirements.txt

      - name: Resolve score date
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE="$(date -u +%F)"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Scoring date: $DATE"

      - name: Check for MLB games (regular season / postseason)
        id: games
        run: |
          N=$(python3 - "${{ steps.date.outputs.date }}" <<'PY'
          import sys, requests
          url = f"https://statsapi.mlb.com/api/v1/schedule?sportId=1&date={sys.argv[1]}"
          d = requests.get(url, timeout=60).json()
          print(sum(1 for x in d.get("dates", []) for g in x.get("games", [])
                    if str(g.get("gameType") or "R").upper() not in {"S", "E", "A"}))
          PY
          )
          echo "count=$N" >> "$GITHUB_OUTPUT"
          if [ "$N" = "0" ]; then echo "No MLB games on ${{ steps.date.outputs.date }} — skipping refresh."; fi

      - name: Re-grade history and refit K-ladder calibration
        if: steps.games.outputs.count != '0'
        run: |
          python3 mlb-k-matchups/grade_history.py || echo "K grading skipped"
          python3 mlb-k-matchups/grade_hits.py || echo "hits grading skipped"

      - name: Run K-matchup model
        if: steps.games.outputs.count != '0'
        run: |
          python3 mlb-k-matchups/k_matchups.py \
            --date "${{ steps.date.outputs.date }}" \
            -o "rankings-${{ steps.date.outputs.date }}.csv" \
            --html rankings.html \
            -v
          # write_interactive_html also writes index.html for the stable Pages URL

      - name: Commit and push rankings
        if: steps.games.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rankings.html index.html "rankings-${{ steps.date.outputs.date }}.csv"
          git add "hits-${{ steps.date.outputs.date }}.csv" k-calibration.json graded-history.csv hits-calibration.json graded-hits-history.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No rankings changes to commit."
            exit 0
          fi

          git commit -m "Daily rankings ${{ steps.date.outputs.date }}"
          git push
